name: Track status

# Three passes a day: 8am, noon and 2pm Eastern. The morning read sets
# expectations, noon catches weather moving in, and 2pm is the one that
# decides the night.
#
# Runs every day rather than only Fri/Sat — the schedule has races on
# Tuesdays (Mr. Dirt Track USA, Eve of Destruction), Wednesdays (Firecracker
# 50) and Thursdays, and daily readings are what give next week's numbers a
# trend to move against. A day with nothing scheduled is a cheap no-op.
#
# Cron is UTC and racing season is entirely EDT, so these land correctly
# April through October. The January and March dates read an hour earlier.
on:
  schedule:
    - cron: "0 12 * * *"   # 8:00 AM ET
    - cron: "0 16 * * *"   # 12:00 PM ET
    - cron: "0 18 * * *"   # 2:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read forecast and write status
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/update-status.mjs

      - name: Confirm the files exist
        run: |
          ls -la data/
          test -f data/status.json || { echo "::error::status.json was not written"; exit 1; }
          test -f data/trend.json  || { echo "::error::trend.json was not written"; exit 1; }
          echo "--- status.json ---"
          head -c 400 data/status.json

      - name: Commit and push
        run: |
          git config user.name "dirtcall-bot"
          git config user.email "actions@github.com"
          git add data/status.json data/trend.json
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Pushed."
          fi
